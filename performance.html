<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Performance Analysis | Attrition Insights</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body {
      background: url('https://images.unsplash.com/photo-1600880292203-757bb62b4baf?auto=format&fit=crop&w=1600&q=80')
        no-repeat center center/cover;
      min-height: 100vh;
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      color: #fff;
      position: relative;
    }

    body::before {
      content: "";
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.55);
      backdrop-filter: blur(8px);
      z-index: 0;
    }

    .container {
      position: relative;
      z-index: 1;
    }

    h2 {
      font-weight: 600;
      text-align: center;
      margin-bottom: 40px;
      font-size: 2rem;
    }

    .analysis-card {
      background: rgba(255, 255, 255, 0.15);
      border-radius: 20px;
      padding: 40px;
      height: 450px; /* Increased height */
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
      backdrop-filter: blur(12px);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      border: 1px solid rgba(255, 255, 255, 0.25);
    }

    .analysis-card:hover {
      transform: scale(1.03);
      box-shadow: 0 10px 35px rgba(0, 0, 0, 0.5);
    }

    .analysis-card h5 {
      color: #fff;
      font-weight: 500;
      margin-bottom: 20px;
      font-size: 1.25rem;
      text-align: center;
    }

    canvas {
      width: 100% !important;
      height: 320px !important; /* Increased chart height */
    }

    .btn-outline-light {
      border-color: rgba(255, 255, 255, 0.7);
      color: #fff;
      border-radius: 10px;
      transition: 0.3s;
    }

    .btn-outline-light:hover {
      background: rgba(255, 255, 255, 0.2);
      transform: scale(1.05);
    }
  </style>
</head>
<body class="p-4">
  <div class="container">
    <a href="dashboard.html" class="btn btn-outline-light mb-4">⬅ Back to Dashboard</a>
    <h2>📊 Performance Analysis</h2>

    <div class="row g-4">
      <div class="col-md-6">
        <div class="analysis-card">
          <h5>Performance Trend</h5>
          <canvas id="perfTrend"></canvas>
        </div>
      </div>
      <div class="col-md-6">
        <div class="analysis-card">
          <h5>Department Comparison</h5>
          <canvas id="deptChart"></canvas>
        </div>
      </div>
    </div>
  </div>

  <script>
    // Chart: Performance Trend
    new Chart(document.getElementById('perfTrend'), {
      type: 'line',
      data: {
        labels: ['2019', '2020', '2021', '2022', '2023'],
        datasets: [{
          label: 'Performance Score',
          data: [70, 75, 78, 82, 88],
          borderColor: '#76baff',
          backgroundColor: 'rgba(118,186,255,0.15)',
          borderWidth: 2.5,
          tension: 0.4,
          fill: true,
          pointRadius: 4,
          pointBackgroundColor: '#fff'
        }]
      },
      options: {
        plugins: { legend: { labels: { color: '#fff' } } },
        scales: {
          x: { ticks: { color: '#fff' }, grid: { color: 'rgba(255,255,255,0.1)' } },
          y: { ticks: { color: '#fff' }, grid: { color: 'rgba(255,255,255,0.1)' } }
        }
      }
    });

    // Chart: Department Comparison
    new Chart(document.getElementById('deptChart'), {
      type: 'bar',
      data: {
        labels: ['IT', 'HR', 'Finance', 'Sales', 'Operations'],
        datasets: [{
          label: 'Average Score',
          data: [84, 72, 88, 76, 81],
          backgroundColor: ['#00c853', '#ff9800', '#2196f3', '#e91e63', '#9c27b0'],
          borderRadius: 6
        }]
      },
      options: {
        plugins: { legend: { labels: { color: '#fff' } } },
        scales: {
          x: { ticks: { color: '#fff' }, grid: { color: 'rgba(255,255,255,0.1)' } },
          y: { ticks: { color: '#fff' }, grid: { color: 'rgba(255,255,255,0.1)' } }
        }
      }
    });
  </script>
</body>
</html>
