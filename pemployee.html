<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Employee Attrition Prediction | Home</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    /* === Page Background === */
    body {
      background: url("https://images.unsplash.com/photo-1600880292203-757bb62b4baf?auto=format&fit=crop&w=1600&q=90")
        no-repeat center center/cover;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      font-family: 'Segoe UI', sans-serif;
      overflow: hidden;
      position: relative;
      color: #fff;
    }

    /* === Dark Overlay === */
    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(6px);
      z-index: 0;
    }

    /* === Floating Shapes Animation === */
    .shape {
      position: absolute;
      border-radius: 50%;
      opacity: 0.15;
      background: linear-gradient(135deg, #764ba2, #667eea);
      animation: float 10s infinite ease-in-out;
    }
    .shape:nth-child(1) { width: 160px; height: 160px; top: 10%; left: 15%; animation-delay: 0s; }
    .shape:nth-child(2) { width: 120px; height: 120px; bottom: 15%; right: 20%; animation-delay: 2s; }
    .shape:nth-child(3) { width: 200px; height: 200px; bottom: 5%; left: 25%; animation-delay: 4s; }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-25px); }
    }

    /* === Hero Section === */
    .hero {
      position: relative;
      z-index: 2;
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 25px;
      padding: 60px 40px;
      max-width: 720px;
      backdrop-filter: blur(10px);
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.5);
      animation: fadeIn 1.2s ease-in-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .hero h1 {
      font-size: 2.5rem;
      font-weight: 700;
      background: linear-gradient(135deg, #a18cd1, #fbc2eb);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .hero .lead {
      font-size: 1.15rem;
      color: #f5f5f5;
      line-height: 1.8;
      margin-top: 10px;
      margin-bottom: 30px;
    }

    /* === Button === */
    .btn-custom {
      background: linear-gradient(135deg, #667eea, #764ba2);
      border: none;
      border-radius: 30px;
      padding: 14px 34px;
      font-size: 1.05rem;
      color: #fff;
      font-weight: 500;
      transition: 0.3s ease;
      box-shadow: 0 4px 12px rgba(118, 75, 162, 0.4);
    }
    .btn-custom:hover {
      transform: scale(1.08);
      box-shadow: 0 6px 18px rgba(118, 75, 162, 0.6);
    }

    footer {
      position: absolute;
      bottom: 15px;
      width: 100%;
      text-align: center;
      font-size: 0.85rem;
      color: rgba(255, 255, 255, 0.8);
    }
  </style>
</head>
<body>
  <div class="overlay"></div>

  <!-- Floating gradient shapes -->
  <div class="shape"></div>
  <div class="shape"></div>
  <div class="shape"></div>

  <!-- Hero Section -->
  <div class="hero">
    <h1>Employee Attrition Prediction</h1>
    <p class="lead">
      Use AI-powered insights to predict employee turnover, analyze workforce trends, and make proactive retention decisions.
    </p>
    <a href="login.html" class="btn btn-custom">Get Started</a>
  </div>

  <footer>© 2025 Attrition Insights | Empowering Smarter HR Decisions</footer>
</body>
</html>
