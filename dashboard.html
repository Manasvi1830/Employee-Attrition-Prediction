<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Dashboard | Employee Attrition</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body {
      background: 
        linear-gradient(rgba(0, 0, 0, 0.5), rgba(0, 0, 0, 0.5)),
        url('https://images.unsplash.com/photo-1600880292203-757bb62b4baf?auto=format&fit=crop&w=1400&q=80') 
        no-repeat center center/cover;
      min-height: 100vh;
      backdrop-filter: blur(6px);
      color: #fff;
      font-family: 'Segoe UI', sans-serif;
    }

    .glass-card {
      background: rgba(255, 255, 255, 0.15);
      border-radius: 18px;
      padding: 16px 18px;
      backdrop-filter: blur(12px);
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.25);
      color: #fff;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.3s ease;
      text-align: center;
    }

    .glass-card:hover {
      transform: scale(1.04);
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.35);
    }

    h2, h5 { color: #fff; }

    .glass-card h2 {
      font-size: 2rem;
      margin-top: 10px;
      font-weight: bold;
    }

    .btn-light {
      border-radius: 25px;
      font-weight: 500;
      padding: 10px 20px;
      transition: 0.3s;
    }

    .btn-light:hover {
      background: #764ba2;
      color: #fff;
      transform: scale(1.05);
    }

    canvas {
      max-height: 300px;
    }
  </style>
</head>
<body>
  <div class="container mt-4">
    <h2 class="text-center mb-4">📊 HR Analytics Dashboard</h2>

    <div class="row g-4">
      <div class="col-md-3 col-sm-6">
        <div class="glass-card">
          <h5>Employees</h5><h2>1200</h2>
        </div>
      </div>
      <div class="col-md-3 col-sm-6">
        <div class="glass-card">
          <h5>Predicted Leavers</h5><h2>85</h2>
        </div>
      </div>
      <div class="col-md-3 col-sm-6">
        <div class="glass-card">
          <h5>Retention Rate</h5><h2>92%</h2>
        </div>
      </div>
      <div class="col-md-3 col-sm-6">
        <a href="employees.html" style="text-decoration:none; color:inherit;">
          <div class="glass-card">
            <h5>High Risk</h5><h2>34</h2>
          </div>
        </a>
      </div>
    </div>

    <div class="row mt-4">
      <div class="col-md-6">
        <div class="glass-card">
          <h5>Risk Distribution</h5>
          <canvas id="riskChart"></canvas>
        </div>
      </div>
      <div class="col-md-6">
        <div class="glass-card">
          <h5>Monthly Trends</h5>
          <canvas id="trendChart"></canvas>
        </div>
      </div>
    </div>

    <div class="text-center mt-4">
      <a href="employees.html" class="btn btn-light">👥 Manage Employees</a>
    </div>
  </div>

  <script>
    new Chart(document.getElementById('riskChart'), {
      type: 'doughnut',
      data: { 
        labels: ['Low','Medium','High'], 
        datasets:[{ 
          data:[60,25,15], 
          backgroundColor:['#00c853','#ffca28','#e53935'] 
        }] 
      }
    });

    new Chart(document.getElementById('trendChart'), {
      type: 'line',
      data: { 
        labels:['Jan','Feb','Mar','Apr'], 
        datasets:[{ 
          label:'Attrition', 
          data:[5,10,7,12], 
          borderColor:'#fff', 
          tension:0.4 
        }] 
      }
    });
  </script>
</body>
</html>
