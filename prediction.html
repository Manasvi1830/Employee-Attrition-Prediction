<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Prediction Results | Attrition Insights</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background: url('https://images.unsplash.com/photo-1600880292203-757bb62b4baf?auto=format&fit=crop&w=1400&q=80')
        no-repeat center center/cover;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', sans-serif;
      color: #fff;
      position: relative;
    }

    /* Overlay for darker background tone */
    body::before {
      content: "";
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.55);
      backdrop-filter: blur(8px);
      z-index: 0;
    }

    .result-card {
      position: relative;
      z-index: 1;
      background: rgba(255, 255, 255, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 20px;
      padding: 2.5rem;
      max-width: 520px;
      width: 90%;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(12px);
      text-align: center;
      transition: transform 0.3s ease;
    }

    .result-card:hover {
      transform: scale(1.02);
    }

    h3 {
      font-weight: 600;
      margin-bottom: 15px;
      color: #fff;
    }

    h5 {
      margin-top: 20px;
      color: #fff;
      font-weight: 500;
    }

    ul {
      text-align: left;
      margin-top: 10px;
      color: rgba(255, 255, 255, 0.9);
    }

    p, li {
      font-size: 0.95rem;
      color: rgba(255, 255, 255, 0.9);
    }

    .badge {
      font-size: 0.85rem;
      padding: 0.4em 0.7em;
    }

    .btn-custom {
      background: linear-gradient(135deg, #6a11cb, #2575fc);
      border: none;
      border-radius: 10px;
      color: #fff;
      font-weight: 500;
      padding: 10px 14px;
      transition: 0.3s;
      width: 100%;
    }

    .btn-custom:hover {
      transform: scale(1.05);
      background: linear-gradient(135deg, #2575fc, #6a11cb);
    }

    .btn-outline-light {
      border-color: rgba(255, 255, 255, 0.7);
      color: #fff;
      border-radius: 10px;
    }

    .btn-outline-light:hover {
      background: rgba(255, 255, 255, 0.2);
    }

  </style>
</head>
<body>
  <div class="result-card" id="reportCard">
    <!-- Report will load here -->
  </div>

  <script>
    // Read employee from URL
    const params = new URLSearchParams(window.location.search);
    const employee = params.get("employee");

    // Reports for each employee
    const reports = {
      alice: {
        name: "Aarohi Sharma",
        risk: "78%",
        riskBadge: "bg-danger",
        confidence: "85%",
        factors: ["Low Job Satisfaction", "High Overtime", "Few Promotions"]
      },
      bob: {
        name: "Rohit Verma",
        risk: "22%",
        riskBadge: "bg-success",
        confidence: "90%",
        factors: ["High Job Satisfaction", "Stable Working Hours", "Recent Promotion"]
      }
    };

    // Pick correct report or fallback
    const report = reports[employee] || reports.alice;

    // Render HTML dynamically
    document.getElementById("reportCard").innerHTML = `
      <h3>Employee: ${report.name}</h3>
      <p><strong>Risk Score:</strong> ${report.risk}
         <span class="badge ${report.riskBadge}">
           ${parseInt(report.risk) > 50 ? "High Risk" : "Low Risk"}
         </span>
      </p>
      <p><strong>Confidence:</strong> ${report.confidence}</p>
      <h5>Contributing Factors:</h5>
      <ul>${report.factors.map(f => `<li>${f}</li>`).join("")}</ul>
      <button class="btn-custom mt-3" onclick="location.href='performance.html'">📈 View Performance Analysis</button>
      <a href="employees.html" class="btn btn-outline-light mt-2">⬅ Back to Employees</a>
    `;
  </script>
</body>
</html>
